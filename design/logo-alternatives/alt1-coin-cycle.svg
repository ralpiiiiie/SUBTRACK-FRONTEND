<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Coin/card shape with recurring cycle arrow -->
  <defs>
    <linearGradient id="alt1Gradient" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f2545b"/>
      <stop offset="100%" stop-color="#c93a45"/>
    </linearGradient>
  </defs>

  <!-- Rounded card/coin shape -->
  <path d="M8 8h32a4 4 0 0 1 4 4v24a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V12a4 4 0 0 1 4-4z"
        stroke="url(#alt1Gradient)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Recurring cycle: two arrows forming a circle -->
  <path d="M24 14a10 10 0 0 1 0 20" stroke="url(#alt1Gradient)" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M24 14a10 10 0 0 0 0 20" stroke="url(#alt1Gradient)" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Arrowheads -->
  <path d="M34 24l-3 3 3 3" stroke="url(#alt1Gradient)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M14 24l3-3-3-3" stroke="url(#alt1Gradient)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>